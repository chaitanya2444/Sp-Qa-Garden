[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:nginx]
command=/usr/sbin/nginx -c /app/nginx.conf
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:crawler]
command=python -m uvicorn fastapi_endpoint:app --host 127.0.0.1 --port 8005
directory=/app/agents/crawler
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:test_generator]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8001
directory=/app/agents/test_generator
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:playwright_gen]
command=python -m uvicorn main:app --host 127.0.0.1 --port 8002
directory=/app/agents/playwright_gen
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:cicd]
command=python -m uvicorn main:app --host 127.0.0.1 --port 8003
directory=/app/agents/cicd
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:triage]
command=python main.py
directory=/app/agents/triage_engine
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
